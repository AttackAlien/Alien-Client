name: Sky Studio Ultimate - Forge 1.8.9

on:
  push:
    branches:
      - feature/sky-studio-ultimate
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: sky-studio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: "Forge 1.8.9 | ${{ matrix.edition }}"
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        edition: [legit, full]
    env:
      ALIEN_TOOLS_DIR: ${{ github.workspace }}/.tools
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-user
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
      - name: Bootstrap verified legacy toolchain
        run: bash ./scripts/bootstrap.sh
      - name: Compile, test and verify reobfuscated JAR
        run: ./gradlew --no-daemon "-Pedition=${{ matrix.edition }}" setupDecompWorkspace build
      - name: Upload JAR and JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "sky-studio-${{ matrix.edition }}-${{ github.run_id }}"
          retention-days: 10
          if-no-files-found: warn
          path: |
            build/${{ matrix.edition }}/libs/*.jar
            build/${{ matrix.edition }}/test-results/
            build/${{ matrix.edition }}/reports/tests/
