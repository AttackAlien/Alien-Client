name: Alien Client - Forge 1.8.9 CI

on:
  push:
    branches:
      - feature/panelstudio-ui-foundation
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alien-forge-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  forge:
    name: "Forge 1.8.9 | ${{ matrix.edition }}"
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        edition: [legit, full]

    env:
      ALIEN_TOOLS_DIR: ${{ github.workspace }}/.tools
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-user
      LIBGL_ALWAYS_SOFTWARE: "1"
      EDITION: ${{ matrix.edition }}

    steps:
      - name: Check out the branch under test
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select Java 8 (ForgeGradle 2.1 requirement)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Install headless OpenGL display dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            xvfb libgl1 libgl1-mesa-dri libxrandr2 libxi6 libxcursor1 libxtst6 libxinerama1 libasound2

      - name: Bootstrap verified JDK 8 and Gradle 2.14.1
        run: |
          bash ./scripts/bootstrap.sh
          . ./scripts/gradle-env.sh
          java -version
          test "$(java -version 2>&1 | head -1 | grep -c '1.8.')" -eq 1

      - name: Build, run JUnit and verify the actual edition JAR
        run: |
          ./gradlew --no-daemon "-Pedition=$EDITION" setupDecompWorkspace build
          test -s "build/$EDITION/libs/AlienClient-${EDITION^}-1.8.9.jar"
          sha256sum "build/$EDITION/libs/AlienClient-${EDITION^}-1.8.9.jar" \
            | tee "build/$EDITION/SHA256SUMS.txt"

      - name: Run real Minecraft/Forge smoke tests (Xvfb + Mesa)
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24 +extension GLX +render -noreset" \
            env ALIEN_EDITION="$EDITION" LIBGL_ALWAYS_SOFTWARE=1 ./scripts/smoke-client.sh
          grep -Eq '^PASS [1-9][0-9]* checks$' "build/$EDITION/smoke/result.txt"

      - name: Summarize validation
        if: success()
        run: |
          echo "### Alien Client - $EDITION" >> "$GITHUB_STEP_SUMMARY"
          echo "- Java 8 / Minecraft Forge 1.8.9" >> "$GITHUB_STEP_SUMMARY"
          echo "- Gradle build, JUnit, reobfuscated JAR inspection: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Actual Minecraft/Forge smoke test: $(head -n 1 "build/$EDITION/smoke/result.txt")" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA256: $(cut -d ' ' -f 1 "build/$EDITION/SHA256SUMS.txt")" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload mod, reports and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "alien-${{ matrix.edition }}-${{ github.run_id }}"
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/${{ matrix.edition }}/libs/*.jar
            build/${{ matrix.edition }}/SHA256SUMS.txt
            build/${{ matrix.edition }}/test-results/
            build/${{ matrix.edition }}/reports/tests/
            build/${{ matrix.edition }}/smoke/
