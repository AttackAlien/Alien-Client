name: Upload v0.1.0 release assets

on:
  workflow_dispatch:

concurrency:
  group: release-assets-v0.1.0
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out the verified release artifacts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: release-artifacts/v0.1.0
          persist-credentials: false

      - name: Verify artifact checksums
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check --strict SHA256SUMS.txt

      - name: Upload assets to the existing draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$(gh release view v0.1.0 --json isDraft --jq '.isDraft')" != true ]]; then
            printf 'Expected an existing draft release for v0.1.0; refusing to upload.\n' >&2
            exit 1
          fi
          gh release upload v0.1.0 \
            alien-client-0.1.0.jar \
            alien-client-0.1.0-source.zip \
            alien-client-capturas-reais.zip \
            SHA256SUMS.txt \
            --clobber
