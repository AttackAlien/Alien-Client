name: Alien Client Unified | Forge 1.8.9

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alien-unified-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unified:
    name: Unified JAR | Java 8
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      ALIEN_TOOLS_DIR: ${{ github.workspace }}/.tools
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-user
      ALIEN_EDITION: "unified"
      ALIEN_COMBAT_SMOKE_TIMEOUT_SECONDS: "480"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Install connected Xorg dummy monitor and software OpenGL
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            xserver-xorg-core xserver-xorg-video-dummy x11-xserver-utils x11-utils mesa-utils \
            libgl1 libgl1-mesa-dri libxrandr2 libxi6 libxcursor1 libxtst6 libxinerama1 libasound2
      - name: Bootstrap verified JDK 8 and Gradle 2.14.1
        run: bash ./scripts/bootstrap.sh
      - name: Compile Unified, run JUnit and verify actual JAR provenance
        run: ./gradlew --no-daemon -Pedition=unified clean setupDecompWorkspace build
      - name: Inspect Unified artifact
        run: |
          test -s build/unified/libs/AlienClient-Unified-1.8.9.jar
          sha256sum build/unified/libs/AlienClient-Unified-1.8.9.jar | tee build/unified/SHA256SUMS.txt
      - name: Validate graphical runner syntax
        run: bash -n scripts/ci-smoke-xorg.sh scripts/ci-sky-smoke-xorg.sh scripts/ci-combat-smoke-xorg.sh scripts/ci-ultimate-smoke-xorg.sh scripts/ci-scene-smoke-xorg.sh
      - name: Validate redesigned studios in actual Unified Minecraft
        run: bash ./scripts/ci-smoke-xorg.sh
      - name: Validate cubemap and gallery in actual Unified Minecraft
        run: bash ./scripts/ci-sky-smoke-xorg.sh
      - name: Bind the upcoming game test to exact built and JUnit-tested inputs
        run: python3 ./scripts/package-unified.py --begin-validation
      - name: Run Combat Studio inside actual Forge 1.8.9 with screenshots
        run: bash ./scripts/ci-combat-smoke-xorg.sh
      - name: Validate HUD Ultimate and Full tools in real Forge
        run: bash ./scripts/ci-ultimate-smoke-xorg.sh
      - name: Validate all nine visual scenes in actual Forge 1.8.9
        run: bash ./scripts/ci-scene-smoke-xorg.sh
      - name: Summarize in-game checks
        if: success()
        run: |
          echo "## Alien Unified Combat Studio" >> "$GITHUB_STEP_SUMMARY"
          echo "Actual Minecraft 1.8.9: $(head -n 1 build/unified/combat-smoke/result.txt)" >> "$GITHUB_STEP_SUMMARY"
      - name: Validate packaging and stale-evidence rejection against real built artifacts
        if: success()
        run: python3 -m unittest discover -s scripts/tests -p 'test_package_unified.py' -v
      - name: Package tested installable ZIP and standalone JAR
        if: success()
        run: python3 ./scripts/package-unified.py
      - name: Upload installer, checksums, JUnit, screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alien-unified-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            build/unified/libs/AlienClient-Unified-1.8.9.jar
            build/unified/SHA256SUMS.txt
            build/unified/test-results/
            build/unified/reports/tests/
            build/unified/smoke/
            build/unified/sky-smoke/
            build/unified/combat-smoke/
            build/unified/ultimate-smoke/
            build/unified/scene-smoke/
            build/unified/validation-inputs.json
            build/unified/distribution/

  windows-package-check:
    name: Windows | ZIP and JAR integrity (not Minecraft gameplay)
    needs: unified
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Download the exact passing Unified artifact
        uses: actions/download-artifact@v4
        with:
          name: alien-unified-${{ github.run_id }}
          path: artifact
      - name: Extract the Windows installer and validate its SHA-256
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = 'artifact/distribution/AlienClient-Unified-Primeiro-Teste.zip'
          if (-not (Test-Path -LiteralPath $zip)) { throw 'Validated installer ZIP missing' }
          Expand-Archive -LiteralPath $zip -DestinationPath 'install-check' -Force
          $jar = 'install-check/AlienClient-Unified-1.8.9.jar'
          $hashes = 'install-check/SHA256SUMS.txt'
          if (-not (Test-Path -LiteralPath $jar)) { throw 'Unified JAR missing from ZIP' }
          if (-not (Test-Path -LiteralPath $hashes)) { throw 'SHA256SUMS.txt missing' }
          $expectedLine = (Get-Content -LiteralPath $hashes -Raw).Trim()
          if ($expectedLine -notmatch '^([0-9a-f]{64})  AlienClient-Unified-1\.8\.9\.jar$') {
            throw 'Invalid SHA256SUMS format'
          }
          $expected = $Matches[1]
          $actual = (Get-FileHash -LiteralPath $jar -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw 'Windows-extracted JAR SHA256 mismatch' }
          $count = @(Get-ChildItem 'install-check' -Filter '*.jar').Count
          if ($count -ne 1) { throw "Expected one installable JAR, got $count" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $jar).Path)
          try {
            $entries = @($archive.Entries | ForEach-Object { $_.FullName })
            if ($entries -notcontains 'META-INF/MANIFEST.MF' -or
                $entries -notcontains 'META-INF/alienclient/edition.json' -or
                $entries -notcontains 'dev/alien/client/AlienClient.class') {
              throw 'Expected Forge Unified entry points not found in JAR'
            }
          } finally { $archive.Dispose() }
          Write-Host "Windows archive extraction and SHA256 passed: $actual"
