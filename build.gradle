buildscript {
    repositories {
        mavenCentral()
        maven { name = 'forge'; url = 'https://maven.minecraftforge.net/' }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.1-SNAPSHOT'
    }
}

// Unified is now the default distributable. Keep old edition roots for
// backwards-compatibility builds while users migrate profiles.
def selectedEdition = project.hasProperty('edition') ? project.property('edition').toString() : 'unified'
if (!(selectedEdition in ['legit', 'full', 'unified'])) {
    throw new GradleException('edition must be legit, full or unified')
}
ext.alienEdition = selectedEdition
ext.alienEditionName = selectedEdition == 'unified' ? 'Alien Client' :
        selectedEdition == 'legit' ? 'Alien Client Legit' : 'Alien Client Full'
ext.alienEditionDescription = selectedEdition == 'unified' ? 'Unified / configurable combat' :
        selectedEdition == 'legit' ? 'Visuals & Performance' : 'Architecture preview'
buildDir = file("build/${selectedEdition}")

apply plugin: 'net.minecraftforge.gradle.forge'
apply from: 'scripts/https-assets.gradle'

version = '0.6.0-alpha.1'
group = 'dev.alien.client'
archivesBaseName = selectedEdition == 'unified' ? 'AlienClient-Unified-1.8.9' :
        selectedEdition == 'legit' ? 'AlienClient-Legit-1.8.9' : 'AlienClient-Full-1.8.9'
sourceCompatibility = targetCompatibility = '1.8'

minecraft {
    version = '1.8.9-11.15.1.2318-1.8.9'
    runDir = "run/${selectedEdition}"
    mappings = 'stable_22'
}

repositories {
    mavenCentral()
}

dependencies {
    testCompile 'junit:junit:4.13.2'
}

// A separate test-only Forge mod exercises the real GUI/rendering lifecycle.
// Its classes are never included in the distributable production JAR.
sourceSets {
    main {
        java.setSrcDirs(['src/main/java', "src/${selectedEdition}/java"])
        resources.setSrcDirs(['src/main/resources', "src/${selectedEdition}/resources"])
    }
    test {
        java.setSrcDirs(['src/test/java', "src/${selectedEdition}Test/java"])
        resources.setSrcDirs(['src/test/resources', "src/${selectedEdition}Test/resources"])
    }
    smoke {
        java.setSrcDirs(['src/smoke/java', "src/${selectedEdition}Smoke/java"])
        resources.setSrcDirs(['src/smoke/resources', "src/${selectedEdition}Smoke/resources"])
        compileClasspath = sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath = output + compileClasspath
    }
    skySmoke {
        java.setSrcDirs(['src/skySmoke/java'])
        resources.setSrcDirs(['src/skySmoke/resources'])
        compileClasspath = sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath = output + compileClasspath
    }
    combatSmoke {
        java.setSrcDirs(['src/combatSmoke/java'])
        resources.setSrcDirs(['src/combatSmoke/resources'])
        compileClasspath = sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath = output + compileClasspath
    }
    ultimateSmoke {
        java.setSrcDirs(['src/ultimateSmoke/java'])
        resources.setSrcDirs(['src/ultimateSmoke/resources'])
        compileClasspath = sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath = output + compileClasspath
    }
}

task runSmokeClient(type: JavaExec, dependsOn: ['classes', 'smokeClasses', 'makeStart']) {
    group = 'verification'
    description = 'Runs the test-only integration mod in the actual Minecraft client'
}

afterEvaluate {
    runSmokeClient {
        main = runClient.main
        // ForgeGradle's runClient classpath points to the last built JAR.
        // Use freshly compiled classes here, without a duplicate stale mod JAR.
        classpath = sourceSets.main.output + runClient.classpath.filter {
            it.canonicalFile != jar.archivePath.canonicalFile
        } + sourceSets.smoke.output
        workingDir = file("${buildDir}/smoke-runtime")
        def smokeArgs = new ArrayList(runClient.args)
        def gameDirIndex = smokeArgs.indexOf('--gameDir')
        if (gameDirIndex >= 0 && gameDirIndex + 1 < smokeArgs.size()) {
            smokeArgs[gameDirIndex + 1] = workingDir.absolutePath
        }
        args = smokeArgs
        jvmArgs = runClient.jvmArgs
        systemProperty 'alien.smoke', 'true'
        systemProperty 'alien.smoke.output', file("${buildDir}/smoke").absolutePath
        systemProperty 'alien.smoke.edition', selectedEdition
        systemProperty 'alien.smoke.mainClasses', sourceSets.main.output.classesDir.absolutePath
        systemProperty 'java.net.preferIPv4Stack', 'true'
        doFirst { workingDir.mkdirs() }
    }
}

task runSkySmokeClient(type: JavaExec, dependsOn: ['classes', 'skySmokeClasses', 'makeStart']) {
    group = 'verification'
    description = 'Launch actual Minecraft/Forge with only the disposable Sky Studio smoke mod'
}

afterEvaluate {
    runSkySmokeClient {
        main = runClient.main
        classpath = sourceSets.main.output + runClient.classpath.filter {
            it.canonicalFile != jar.archivePath.canonicalFile
        } + sourceSets.skySmoke.output
        workingDir = file("${buildDir}/sky-smoke-runtime")
        def smokeArgs = new ArrayList(runClient.args)
        def gameDirIndex = smokeArgs.indexOf('--gameDir')
        if (gameDirIndex >= 0 && gameDirIndex + 1 < smokeArgs.size()) {
            smokeArgs[gameDirIndex + 1] = workingDir.absolutePath
        }
        args = smokeArgs
        jvmArgs = runClient.jvmArgs
        systemProperty 'alien.sky.smoke', 'true'
        systemProperty 'alien.sky.smoke.output', file("${buildDir}/sky-smoke").absolutePath
        systemProperty 'alien.sky.smoke.edition', selectedEdition
        systemProperty 'java.net.preferIPv4Stack', 'true'
        doFirst { workingDir.mkdirs() }
    }
}

task runCombatSmokeClient(type: JavaExec, dependsOn: ['classes', 'combatSmokeClasses', 'makeStart']) {
    group = 'verification'
    description = 'Launch isolated real Minecraft/Forge to validate Unified Combat Studio'
}
afterEvaluate {
    runCombatSmokeClient {
        main = runClient.main
        classpath = sourceSets.main.output + runClient.classpath.filter {
            it.canonicalFile != jar.archivePath.canonicalFile
        } + sourceSets.combatSmoke.output
        workingDir = file("${buildDir}/combat-smoke-runtime")
        def smokeArgs = new ArrayList(runClient.args)
        def gameDirIndex = smokeArgs.indexOf('--gameDir')
        if (gameDirIndex >= 0 && gameDirIndex + 1 < smokeArgs.size()) {
            smokeArgs[gameDirIndex + 1] = workingDir.absolutePath
        }
        args = smokeArgs
        jvmArgs = runClient.jvmArgs
        systemProperty 'alien.combat.smoke', 'true'
        systemProperty 'alien.combat.smoke.output', file("${buildDir}/combat-smoke").absolutePath
        systemProperty 'java.net.preferIPv4Stack', 'true'
        doFirst { workingDir.mkdirs() }
    }
}

task runUltimateSmokeClient(type: JavaExec, dependsOn: ['classes', 'ultimateSmokeClasses', 'makeStart']) {
    group = 'verification'
    description = 'Launch isolated real Minecraft/Forge to validate HUD Ultimate and Full modules'
}
afterEvaluate {
    runUltimateSmokeClient {
        main = runClient.main
        classpath = sourceSets.main.output + runClient.classpath.filter {
            it.canonicalFile != jar.archivePath.canonicalFile
        } + sourceSets.ultimateSmoke.output
        workingDir = file("${buildDir}/ultimate-smoke-runtime")
        def smokeArgs = new ArrayList(runClient.args)
        def gameDirIndex = smokeArgs.indexOf('--gameDir')
        if (gameDirIndex >= 0 && gameDirIndex + 1 < smokeArgs.size()) {
            smokeArgs[gameDirIndex + 1] = workingDir.absolutePath
        }
        args = smokeArgs
        jvmArgs = runClient.jvmArgs
        systemProperty 'alien.ultimate.smoke', 'true'
        systemProperty 'alien.ultimate.smoke.output', file("${buildDir}/ultimate-smoke").absolutePath
        systemProperty 'java.net.preferIPv4Stack', 'true'
        doFirst { workingDir.mkdirs() }
    }
}

sourceSets {
    sceneSmoke {
        java.setSrcDirs(['src/sceneSmoke/java'])
        compileClasspath = sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath = output + compileClasspath
    }
}
task runSceneSmokeClient(type: JavaExec, dependsOn: ['classes','sceneSmokeClasses','makeStart']) { group = 'verification' }
afterEvaluate {
    runSceneSmokeClient {
        main = runClient.main
        classpath = sourceSets.main.output + runClient.classpath.filter { it.canonicalFile != jar.archivePath.canonicalFile } + sourceSets.sceneSmoke.output
        workingDir = file("${buildDir}/scene-smoke-runtime")
        def gameArgs = new ArrayList(runClient.args)
        def idx = gameArgs.indexOf('--gameDir')
        if (idx >= 0 && idx + 1 < gameArgs.size()) gameArgs[idx+1] = workingDir.absolutePath
        args = gameArgs
        jvmArgs = runClient.jvmArgs
        systemProperty 'alien.scene.smoke','true'
        systemProperty 'alien.scene.smoke.output',file("${buildDir}/scene-smoke").absolutePath
        doFirst { workingDir.mkdirs() }
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

tasks.withType(JavaExec) {
    // Forward supported proxy/trust configuration to the actual game JVM.
    ['https.proxyHost', 'https.proxyPort', 'http.proxyHost', 'http.proxyPort',
     'javax.net.ssl.trustStore', 'javax.net.ssl.trustStorePassword'].each { name ->
        if (System.getProperty(name) != null) systemProperty name, System.getProperty(name)
    }
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mcversion', '1.8.9'
    inputs.property 'edition', selectedEdition
    inputs.property 'editionName', alienEditionName
    inputs.property 'editionDescription', alienEditionDescription
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': '1.8.9',
               'edition': selectedEdition, 'editionName': alienEditionName,
               'editionDescription': alienEditionDescription
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

test {
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}

jar {
    archiveName = archivesBaseName + '.jar'
    manifest {
        attributes 'Implementation-Title': alienEditionName,
                   'Implementation-Version': project.version,
                   'Alien-Edition': selectedEdition,
                   'Alien-Edition-Status': alienEditionDescription,
                   'Minecraft-Version': '1.8.9',
                   'FMLModType': 'MOD',
                   'FMLCorePluginContainsFMLMod': 'false'
    }
}

task verifyEditionArtifact(type: Exec, dependsOn: 'reobfJar') {
    group = 'verification'
    description = 'Verifies the actual reobfuscated JAR and edition source boundary'
    commandLine 'python3', file('scripts/verify-edition-artifact.py').absolutePath,
            '--repository', projectDir.absolutePath,
            '--edition', selectedEdition,
            '--version', project.version.toString(),
            '--jar', jar.archivePath.absolutePath
}

check.dependsOn verifyEditionArtifact

sourceSets {
    studioSmoke {
        java.setSrcDirs(['src/studioSmoke/java'])
        compileClasspath = sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath = output + compileClasspath
    }
}
task runStudioSmokeClient(type: JavaExec, dependsOn: ['classes','studioSmokeClasses','makeStart']) { group = 'verification' }
afterEvaluate {
    runStudioSmokeClient {
        main = runClient.main
        classpath = sourceSets.main.output + runClient.classpath.filter { it.canonicalFile != jar.archivePath.canonicalFile } + sourceSets.studioSmoke.output
        workingDir = file("${buildDir}/studio-smoke-runtime")
        def gameArgs = new ArrayList(runClient.args)
        def idx = gameArgs.indexOf('--gameDir')
        if (idx >= 0 && idx + 1 < gameArgs.size()) gameArgs[idx+1] = workingDir.absolutePath
        args = gameArgs
        jvmArgs = runClient.jvmArgs
        systemProperty 'alien.studio.smoke','true'
        systemProperty 'alien.studio.smoke.output',file("${buildDir}/studio-smoke").absolutePath
        doFirst { workingDir.mkdirs() }
    }
}
