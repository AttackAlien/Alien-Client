# Headless 1280x720 monitor for LWJGL 2 / Minecraft 1.8.9 smoke tests.
# Unlike Xvfb, the Xorg dummy driver exposes a connected RandR display and
# the XF86VidMode extension, which old LWJGL queries during startup.
Section "ServerLayout"
    Identifier "AlienLayout"
    Screen 0 "AlienScreen"
EndSection

Section "ServerFlags"
    Option "AutoAddDevices" "false"
    Option "AllowMouseOpenFail" "true"
EndSection

Section "Device"
    Identifier "AlienDummy"
    Driver "dummy"
    VideoRam 256000
EndSection

Section "Monitor"
    Identifier "AlienMonitor"
    HorizSync 30.0 - 100.0
    VertRefresh 50.0 - 75.0
    Modeline "1280x720" 74.25 1280 1390 1430 1650 720 725 730 750 +HSync +VSync
EndSection

Section "Screen"
    Identifier "AlienScreen"
    Device "AlienDummy"
    Monitor "AlienMonitor"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "1280x720"
        Virtual 1280 720
    EndSubSection
EndSection
