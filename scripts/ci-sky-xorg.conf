# A connected 1280x720 monitor, unlike Xvfb's sometimes empty RandR list.
Section "ServerLayout"
    Identifier "AlienSkyLayout"
    Screen 0 "AlienSkyScreen"
EndSection
Section "ServerFlags"
    Option "AutoAddDevices" "false"
    Option "AllowMouseOpenFail" "true"
EndSection
Section "Device"
    Identifier "AlienSkyDummy"
    Driver "dummy"
    VideoRam 256000
EndSection
Section "Monitor"
    Identifier "AlienSkyMonitor"
    HorizSync 30.0 - 100.0
    VertRefresh 50.0 - 75.0
    Modeline "1280x720" 74.25 1280 1390 1430 1650 720 725 730 750 +HSync +VSync
EndSection
Section "Screen"
    Identifier "AlienSkyScreen"
    Device "AlienSkyDummy"
    Monitor "AlienSkyMonitor"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "1280x720"
        Virtual 1280 720
    EndSubSection
EndSection
